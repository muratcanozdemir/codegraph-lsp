name: Release

# release-please keeps a release pull request open on main: it bumps the version
# (pyproject.toml, uv.lock, .release-please-manifest.json) and writes CHANGELOG.md
# from the Conventional Commits since the last release. Merging it tags vX.Y.Z and
# creates the GitHub release; the jobs below then test and build that commit,
# attach the sdist and wheel to the release and publish them to PyPI.
#
# Everything lives in this one file because tags pushed with the workflow token do
# not trigger other workflows, and PyPI trusted publishing does not accept uploads
# from reusable workflows. The PyPI trusted publisher for codegraph-lsp names this
# file (release.yml) and the "pypi" environment.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # tag, GitHub release, release branch
      pull-requests: write # the release pull request
      issues: write        # its "autorelease" labels
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  test:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (pyright)
        run: uvx pyright@1.1.414 --pythonpath .venv/bin/python

      - name: Test (pytest)
        run: uv run pytest -v

  build:
    needs: [release-please, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build sdist and wheel
        run: uv build

      - name: Check the version matches the tag
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          ls dist/codegraph_lsp-"${TAG#v}"-py3-none-any.whl dist/codegraph_lsp-"${TAG#v}".tar.gz

      - name: Check metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  github-assets:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/codegraph-lsp/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
